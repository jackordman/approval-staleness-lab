name: approve
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "${{ inputs.pr }}" --approve -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

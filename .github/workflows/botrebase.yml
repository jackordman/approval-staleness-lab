name: botrebase
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
      - run: |
          git config user.name bot; git config user.email bot@example.com
          git rebase origin/main
          git push --force origin HEAD:${{ inputs.branch }}
